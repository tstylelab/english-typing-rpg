<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09111d"/>
      <stop offset="0.52" stop-color="#102136"/>
      <stop offset="1" stop-color="#1b1220"/>
    </linearGradient>
    <radialGradient id="auraCyan" cx="76%" cy="18%" r="45%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraGold" cx="20%" cy="78%" r="42%">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172238" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#0b1220" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="practiceCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123b3b"/>
      <stop offset="1" stop-color="#0d1f2c"/>
    </linearGradient>
    <linearGradient id="challengeCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#422017"/>
      <stop offset="1" stop-color="#211425"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity="0.34"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity="0.24"/>
    </filter>
    <style>
      .font { font-family: "M PLUS Rounded 1c", "Zen Maru Gothic", "Kosugi Maru", "Yu Gothic", "Meiryo", sans-serif; }
      .eyebrow { font-size: 20px; font-weight: 900; letter-spacing: 2.4px; }
      .screenTitle { font-size: 48px; font-weight: 900; letter-spacing: 0; }
      .course { font-size: 36px; font-weight: 900; letter-spacing: 0; }
      .zone { font-size: 26px; font-weight: 900; letter-spacing: 0; }
      .mode { font-size: 33px; font-weight: 900; letter-spacing: 0; }
      .body { font-size: 21px; font-weight: 800; letter-spacing: 0; }
      .small { font-size: 18px; font-weight: 800; letter-spacing: 0; }
      .number { font-size: 38px; font-weight: 900; letter-spacing: 0; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#page)"/>
  <rect width="1600" height="900" fill="url(#auraCyan)"/>
  <rect width="1600" height="900" fill="url(#auraGold)"/>

  <g opacity="0.18">
    <circle cx="1330" cy="212" r="108" fill="#e0f2fe"/>
    <path d="M1214 186c72 76 108 164 108 264 0 118-48 222-146 312 180-42 282-138 306-288 22-132-64-252-268-288z" fill="#7dd3fc"/>
    <path d="M1106 664c126-22 246 0 360 66-122 66-260 62-414-12z" fill="#fbbf24"/>
  </g>

  <g class="font" filter="url(#softShadow)">
    <rect x="86" y="56" width="1428" height="788" rx="8" fill="#07111f" opacity="0.58" stroke="#26364d" stroke-width="1.5"/>

    <g filter="url(#smallShadow)">
      <rect x="124" y="96" width="1352" height="96" rx="8" fill="url(#glass)" stroke="#2a4a67" stroke-width="1.5"/>
      <rect x="124" y="96" width="6" height="96" rx="3" fill="#38bdf8"/>
      <text x="156" y="132" fill="#67e8f9" class="eyebrow">CURRENT COURSE</text>
      <text x="156" y="174" fill="#f8fafc" class="course">英検5級 Level 1</text>

      <g transform="translate(980 116)">
        <rect x="0" y="0" width="130" height="54" rx="8" fill="#10243a" stroke="#1f6d91"/>
        <text x="18" y="23" fill="#bae6fd" class="small">学習中</text>
        <text x="88" y="39" fill="#ffffff" class="number">18</text>
      </g>
      <g transform="translate(1128 116)">
        <rect x="0" y="0" width="146" height="54" rx="8" fill="#102f2a" stroke="#1e7a55"/>
        <text x="18" y="23" fill="#bbf7d0" class="small">もう少し</text>
        <text x="104" y="39" fill="#ffffff" class="number">7</text>
      </g>
      <g transform="translate(1292 116)">
        <rect x="0" y="0" width="128" height="54" rx="8" fill="#31233a" stroke="#8b5cf6"/>
        <text x="18" y="23" fill="#ddd6fe" class="small">覚えた</text>
        <text x="86" y="39" fill="#ffffff" class="number">35</text>
      </g>
    </g>

    <text x="124" y="268" fill="#f8fafc" class="screenTitle">モードをえらぶ</text>
    <text x="124" y="304" fill="#94a3b8" class="body">今日の気分に合わせて、練習かチャレンジを選ぼう。</text>

    <g filter="url(#smallShadow)">
      <rect x="124" y="342" width="642" height="318" rx="8" fill="url(#practiceCard)" stroke="#1d8f73" stroke-width="1.5"/>
      <rect x="124" y="342" width="642" height="6" rx="3" fill="#34d399"/>
      <text x="154" y="392" fill="#a7f3d0" class="zone">練習エリア</text>
      <text x="154" y="424" fill="#8fcfc0" class="small">失敗を気にせず、まずは覚える場所</text>

      <rect x="154" y="456" width="582" height="78" rx="8" fill="#0c3b35" stroke="#2dd4bf" stroke-width="1.2"/>
      <circle cx="195" cy="495" r="22" fill="#2dd4bf"/>
      <text x="187" y="504" fill="#042f2e" class="body">A</text>
      <text x="232" y="489" fill="#ffffff" class="mode">基礎練習</text>
      <text x="234" y="517" fill="#bbf7d0" class="small">英語を見て入力</text>

      <rect x="154" y="554" width="582" height="78" rx="8" fill="#123e56" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="195" cy="593" r="22" fill="#38bdf8"/>
      <text x="187" y="602" fill="#082f49" class="body">♪</text>
      <text x="232" y="587" fill="#ffffff" class="mode">リスニング練習</text>
      <text x="234" y="615" fill="#bae6fd" class="small">音声を聞きながら練習</text>
    </g>

    <g filter="url(#smallShadow)">
      <rect x="834" y="342" width="642" height="318" rx="8" fill="url(#challengeCard)" stroke="#c0781d" stroke-width="1.5"/>
      <rect x="834" y="342" width="642" height="6" rx="3" fill="#fbbf24"/>
      <text x="864" y="392" fill="#fde68a" class="zone">チャレンジエリア</text>
      <text x="864" y="424" fill="#e7c68b" class="small">慣れてきたら、ゲームとして挑戦</text>

      <rect x="864" y="456" width="582" height="78" rx="8" fill="#5f2816" stroke="#fb923c" stroke-width="1.2"/>
      <circle cx="905" cy="495" r="22" fill="#fb923c"/>
      <text x="897" y="504" fill="#431407" class="body">♪</text>
      <text x="942" y="489" fill="#ffffff" class="mode">音声チャレンジ</text>
      <text x="944" y="517" fill="#fed7aa" class="small">音だけをたよりに入力</text>

      <rect x="864" y="554" width="582" height="78" rx="8" fill="#5b1c24" stroke="#f87171" stroke-width="1.2"/>
      <circle cx="905" cy="593" r="22" fill="#f87171"/>
      <text x="893" y="602" fill="#450a0a" class="body">訳</text>
      <text x="942" y="587" fill="#ffffff" class="mode">和訳チャレンジ</text>
      <text x="944" y="615" fill="#fecaca" class="small">日本語を見て英語を入力</text>
    </g>

    <g filter="url(#smallShadow)">
      <rect x="124" y="704" width="314" height="72" rx="8" fill="#101827" stroke="#3c485c" stroke-width="1.2"/>
      <text x="186" y="750" fill="#cbd5e1" class="body">ホームへ</text>

      <rect x="466" y="704" width="362" height="72" rx="8" fill="#102033" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="550" y="750" fill="#e0f2fe" class="body">教材を変える</text>

      <rect x="856" y="704" width="620" height="72" rx="8" fill="#171c2a" stroke="#eab308" stroke-width="1.2"/>
      <circle cx="905" cy="740" r="22" fill="#eab308"/>
      <text x="893" y="748" fill="#422006" class="body">本</text>
      <text x="944" y="736" fill="#fef3c7" class="body">単語リスト</text>
      <text x="944" y="762" fill="#d9c88f" class="small">自動再生もここから</text>
    </g>
  </g>
</svg>
