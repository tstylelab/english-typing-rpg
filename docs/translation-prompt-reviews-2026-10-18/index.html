<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>和訳バトル・順次見直しの修正案</title><style>body{font:17px/1.65 system-ui,sans-serif;background:#101d2d;color:#e4edf4;margin:0}main{max-width:1280px;margin:auto;padding:24px}h1{font-size:28px}.intro{max-width:90ch}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:#193247;padding:14px;border-radius:10px}select,input,button{font:inherit;padding:9px;border:1px solid #7bb8c9;border-radius:6px;background:#13283a;color:#fff;max-width:100%}input[type=search]{width:280px}a{color:#9ce8e1}article{background:#152c3e;border:1px solid #496474;border-radius:10px;padding:18px;margin:14px 0}h2{margin:0 0 12px;font-size:22px;color:#ffe3a1}.pair{display:grid;grid-template-columns:1fr 1fr;gap:24px}.label{color:#8fddd4;font-weight:bold}.muted{color:#b5c9d8;font-size:14px}.reason{border-top:1px solid #496474;margin-top:14px;padding-top:10px}.meaning{font-size:19px;font-weight:600}.extra{margin-top:7px}summary{cursor:pointer}p{margin:10px 0}#error{color:#ffb9b0}@media(max-width:680px){main{padding:14px}.pair{grid-template-columns:1fr;gap:18px}.controls{align-items:stretch;flex-direction:column}h1{font-size:24px}}</style><main><h1>和訳バトル：順次見直しの修正案</h1><p class="intro">原稿を再点検した比較一覧です。級・レベルを切り替えて、英語、変更前の表示、変更後の表示、理由を確認できます。<strong>今回の変更内容を確認するための比較一覧です。</strong></p><p class="muted">同義表現には意味の重なりがあります。類義語は比較用で、別解を正解として受け付ける機能ではありません。頭文字・文字数のヒントは追加せず、元の問題英語・保存キー・学習記録は維持します。</p><div class="controls"><label>対象 <select id="scope" aria-label="級とレベル"></select></label><input id="search" type="search" aria-label="英語・和訳で検索" placeholder="英語・和訳で検索"><label><input id="all" type="checkbox">据え置いた問題も表示</label><button id="refresh">最新の案を読み込む</button></div><p id="summary"></p><p id="count" class="muted"></p><p id="error" role="alert"></p><div id="rows"></div><details><summary>語義確認の参考資料（疑わしい項目を重点確認）</summary><ul id="sources"></ul></details><p><a href="../pre2-level2-prompt-review-2026-10-18.html">先に公開した準2級 Level 2の一覧</a></p></main><script type="module">
const $=s=>document.querySelector(s),esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
let inventory=[],audit=null;const params=new URLSearchParams(location.search);
function detail(v){return '<div class="meaning">'+esc(v.meaning)+'</div>'+[['alternatives','類義語'],['contrasts','意味の違い']].map(([key,label])=>v[key]?.length?'<div class="extra">'+label+'：'+v[key].map(i=>esc(i.text)+'（'+esc(i.note)+'）').join('／')+'</div>':'').join('')+(v.formNote?'<div class="extra">表現の形：'+esc(v.formNote)+'</div>':'');}
function render(){if(!audit)return;const query=$('#search').value.toLowerCase();const rows=audit.rows.filter(r=>($('#all').checked||r.changed)&&JSON.stringify([r.text,r.before,r.after]).toLowerCase().includes(query));$('#count').textContent=rows.length+'問を表示';$('#rows').innerHTML=rows.map(r=>'<article><h2>'+esc(r.text)+(r.changed?'':' <span class="muted">据え置き</span>')+'</h2><div class="pair"><section><div class="label">変更前</div>'+detail(r.before)+'</section><section><div class="label">変更後の案</div>'+detail(r.after)+'</section></div><p class="muted reason">'+esc(r.reason)+'</p></article>').join('');}
async function select(){const item=inventory.find(i=>i.file===$('#scope').value);if(!item)return;try{const response=await fetch(item.file+'?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw new Error('読み込みできませんでした');audit=await response.json();$('#summary').textContent=item.name+' Level '+item.level+'：全'+audit.reviewed+'問を点検、'+audit.changed+'問の修正案。'+(audit.status==='editorial-reviewed'?'原稿の再点検済み（'+audit.recheckedOn+'）。':'確認中。');$('#sources').innerHTML=(audit.sources??[]).map(s=>'<li><a href="'+esc(s)+'" target="_blank" rel="noopener">'+esc(s)+'</a></li>').join('');params.set('course',item.course);params.set('level',item.level);history.replaceState(null,'','?'+params);$('#error').textContent='';render();}catch(e){$('#error').textContent=e.message;}}
async function refresh(){const previous=$('#scope').value;const response=await fetch('inventory.json?t='+Date.now(),{cache:'no-store'});inventory=await response.json();$('#scope').innerHTML=inventory.map(i=>'<option value="'+i.file+'">'+esc(i.name)+' Level '+i.level+'（'+i.changed+'問修正）</option>').join('');const desired=inventory.find(i=>i.course===params.get('course')&&i.level===Number(params.get('level')));$('#scope').value=desired?.file??(inventory.some(i=>i.file===previous)?previous:inventory[0]?.file);await select();}
$('#scope').addEventListener('change',select);$('#search').addEventListener('input',render);$('#all').addEventListener('change',render);$('#refresh').addEventListener('click',()=>refresh().catch(e=>$('#error').textContent=e.message));await refresh();
</script></html>
